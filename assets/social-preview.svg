  <text x="392" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#F8FAFC" fill-opacity="0.74">A zero-dependency terminal ruler for numeric</text><text x="392" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#F8FAFC" fill-opacity="0.74">series. gauge reads numbers from arguments, a file</text><text x="392" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#F8FAFC" fill-opacity="0.74">or a pipe and draws a sparkline, signed bars, a</text>
