<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" data-motif="gauge" data-layout="left">
  <title id="title">Gauge social preview</title>
  <desc id="desc">A zero-dependency terminal ruler for numeric series. gauge reads numbers from arguments, a file or a pipe and draws a sparkline, signed bars, a histogram, a box plot or a compact statistics block. stats --json is the machine surface for another tool.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140b0b"/><stop offset="1" stop-color="#2b1515"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.12" r="0.95"><stop offset="0" stop-color="#f87171" stop-opacity="0.28"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  
  <g opacity="0.15" stroke="#F8FAFC">
